<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر رقمي برو - للمنتجات الرقمية والتسويق بالعمولة</title>
<style>
:root {
--bg-color: #0f172a;
--card-bg: #1e293b;
--text-color: #f8fafc;
--text-muted: #94a3b8;
--primary: #10b981;
--primary-hover: #059669;
--accent: #6366f1;
--border: #334155;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
body {
background-color: var(--bg-color);
color: var(--text-color);
line-height: 1.6;
padding: 20px;
}
header {
display: flex;
justify-content: space-between;
align-items: center;
max-width: 1000px;
margin: 0 auto 30px auto;
border-bottom: 1px solid var(--border);
padding-bottom: 15px;
flex-wrap: wrap;
gap: 15px;
}
h1 {
font-size: 1.5rem;
color: var(--primary);
}
.lang-select {
background: var(--card-bg);
color: var(--text-color);
border: 1px solid var(--border);
padding: 8px 12px;
border-radius: 8px;
cursor: pointer;
}
.container {
max-width: 1000px;
margin: 0 auto;
}
.admin-panel {
background: var(--card-bg);
border: 1px solid var(--border);
padding: 20px;
border-radius: 12px;
margin-bottom: 30px;
}
.admin-panel h2 {
font-size: 1.2rem;
margin-bottom: 15px;
color: var(--accent);
}
.form-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 10px;
margin-bottom: 15px;
}
input, textarea, select {
width: 100%;
padding: 10px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--bg-color);
color: var(--text-color);
}
textarea {
resize: vertical;
height: 80px;
grid-column: 1 / -1;
}
button {
background: var(--primary);
color: white;
border: none;
padding: 10px 20px;
border-radius: 8px;
cursor: pointer;
font-weight: bold;
transition: background 0.2s;
}
button:hover {
background: var(--primary-hover);
}
.products-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
gap: 20px;
}
.product-card {
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 12px;
padding: 20px;
display: flex;
flex-direction: column;
justify-content: space-between;
}
.product-title {
font-size: 1.1rem;
margin-bottom: 10px;
}
.product-desc {
font-size: 0.9rem;
color: var(--text-muted);
margin-bottom: 15px;
}
.product-footer {
display: flex;
justify-content: space-between;
align-items: center;
margin-top: 15px;
border-top: 1px solid var(--border);
padding-top: 15px;
}
.price {
font-size: 1.2rem;
font-weight: bold;
color: var(--primary);
}
.btn-link {
background: var(--accent);
text-decoration: none;
color: white;
padding: 8px 14px;
border-radius: 6px;
font-size: 0.85rem;
display: inline-block;
}
.btn-link:hover {
opacity: 0.9;
}
</style>
</head>
<body>

<header>
<h1 id="store-title">متجر المنتجات الرقمية والتسويق بالعمولة</h1>
<select class="lang-select" id="langSwitch" onchange="changeLanguage(this.value)">
<option value="ar">العربية</option>
<option value="en">English</option>
<option value="fr">Français</option>
<option value="es">Español</option>
</select>
</header>

<div class="container">
<!-- لوحة تحكم مدمجة لإضافة المنتجات والروابط -->
<div class="admin-panel">
<h2 id="admin-heading">➕ إضافة منتج أو رابط تسويق جديد</h2>
<form id="productForm" onsubmit="addProduct(event)">
<div class="form-grid">
<input type="text" id="pName" placeholder="اسم المنتج" required>
<input type="text" id="pPrice" placeholder="السعر (مثال: $`25)" required>
<input type="url" id="pUrl" placeholder="رابط التحميل أو رابط الإحالة (Affiliate URL)" required>
</div>
<textarea id="pDesc" placeholder="وصف موجز للمنتج..."></textarea>
<button type="submit" id="btn-add">نشر المنتج في المتجر</button>
</form>
</div>

<!-- قائمة المنتجات -->
<div class="products-grid" id="productsContainer">
<!-- المنتجات ستظهر هنا ديناميكياً -->
</div>
</div>

<script>
// ترجمات بسيطة لواجهة المتجر
const translations = {
ar: {
title: "متجر المنتجات الرقمية والتسويق بالعمولة",
adminTitle: "➕ إضافة منتج أو رابط تسويق جديد",
namePh: "اسم المنتج",
pricePh: "السعر (مثال: $25)", urlPh: "رابط التحميل أو رابط الإحالة (Affiliate URL)", descPh: "وصف موجز للمنتج...", addBtn: "نشر المنتج في المتجر", buyBtn: "الحصول على المنتج / الرابط" }, en: { title: "Digital Products & Affiliate Store", adminTitle: "➕ Add New Product or Affiliate Link", namePh: "Product Name", pricePh: "Price (e.g. $25)",
urlPh: "Download or Affiliate URL",
descPh: "Short product description...",
addBtn: "Publish Product",
buyBtn: "Get Product / Link"
},
fr: {
title: "Boutique Numérique &affiliation",
adminTitle: "➕ Ajouter un produit ou lien d'affiliation",
namePh: "Nom du produit",
pricePh: "Prix (ex: $25)", urlPh: "Lien de téléchargement ou d'affiliation", descPh: "Brève description...", addBtn: "Publier", buyBtn: "Obtenir le produit" }, es: { title: "Tienda Digital y Afiliados", adminTitle: "➕ Agregar Producto o Enlace de Afiliado", namePh: "Nombre del producto", pricePh: "Precio (ej: $25)",
urlPh: "Enlace de descarga o afiliado",
descPh: "Breve descripción...",
addBtn: "Publicar producto",
buyBtn: "Obtener producto"
}
};

// منتجات أولية افتراضية
let products = [
{
name: "حزمة قوالب Notion المتكاملة",
price: "$30", url: "#", desc: "قوالب احترافية لتنظيم المهام وإدارة المشاريع الشخصية والتجارية." }, { name: "كتاب التسويق الرقمي الشامل", price: "$15",
url: "#",
desc: "دليلك العملي للبدء في البيع الرقمي وبناء مصدر دخل مستدام."
}
 ];

function renderProducts() {
const container = document.getElementById('productsContainer');
container.innerHTML = '';
products.forEach(p => {
const lang = document.getElementById('langSwitch').value;
const btnText = translations[lang].buyBtn;

const card = document.createElement('div');
card.className = 'product-card';
card.innerHTML = &lt;div&gt; &lt;h3 class="product-title"&gt;${p.name}</h3>
<p class="product-desc">{p.price}</span>
<a href="{btnText}</a>
</div>
`;
container.appendChild(card);
});
}

function addProduct(e) {
e.preventDefault();
const name = document.getElementById('pName').value;
const price = document.getElementById('pPrice').value;
const url = document.getElementById('pUrl').value;
const desc = document.getElementById('pDesc').value;

products.unshift({ name, price, url, desc });
renderProducts();
document.getElementById('productForm').reset();
}

function changeLanguage(lang) {
document.documentElement.lang = lang;
document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

document.getElementById('store-title').innerText = translations[lang].title;
document.getElementById('admin-heading').innerText = translations[lang].adminTitle;
document.getElementById('pName').placeholder = translations[lang].namePh;
document.getElementById('pPrice').placeholder = translations[lang].pricePh;
document.getElementById('pUrl').placeholder = translations[lang].urlPh;
document.getElementById('pDesc').placeholder = translations[lang].descPh;
document.getElementById('btn-add').innerText = translations[lang].addBtn;

renderProducts();
}

// تشغيل أولي لعرض المنتجات
renderProducts();
</script>
</body>
</html>
